# The whole reason this repository exists.
#
# Before it, three repositories each carried their own pins for the same four
# upstream actions, and three Dependabot queues edited them separately. That is
# how `sigrix-io/mullion` came to run floating tags while `sigrix-io/postern`
# was pinned: nothing failed, the divergence just accumulated between review
# cycles. Here there is one queue, and a bump is reviewed once.
#
# Two GitHub behaviours worth knowing: this file is read from the default
# branch, so editing it on a branch changes nothing until it merges; and
# Dependabot needs the dependency graph enabled on the repository, which is not
# something this file can assert.
#
# One pull request per ecosystem, not one per dependency. The branch ruleset
# only merges a pull request that is up to date with main, so every merge puts
# every other open update behind, and each then needs `@dependabot rebase` and
# a fresh CI run before it can follow. A group costs one round of that. The
# price is that a bump which breaks something holds back the rest of its group
# until it is fixed, or excluded with `@dependabot ignore <dependency>`.
#
# Deliberately no auto-merge. A bump here reaches three repositories at once —
# whichever one next opens a pull request runs it — so it is the last place
# that should merge itself unattended.
version: 2
updates:
  # The root, rather than `.github/workflows`, so this covers the `uses:` lines
  # inside the composite action definitions as well as the ones in CI. Those
  # action files are the point: they hold the pins every consumer no longer
  # writes for itself.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
